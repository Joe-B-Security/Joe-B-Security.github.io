# The blog now lives at https://joesec.me (Astro, Cloudflare Workers).
#
# This repo no longer publishes the Hugo site. It publishes a redirect shim:
# one meta-refresh + canonical stub per old URL, generated from content/posts/
# by build-redirects.py. The Hugo source stays in git as history.
name: Deploy redirect shim to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Generate redirect stubs
        run: python3 build-redirects.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./redirect-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
